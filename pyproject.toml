[project]
name = "signal-tracker"
version = "0.1.0"
description = "Testing-only forex and gold signal research"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1,<4",
]

[project.scripts]
signal-tracker = "signal_tracker.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
